server {
  listen 80;
  server_name _;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline';" always;

  location = / {
    default_type text/html;
    return 404 '<!doctype html><title>prefix only</title><h1>No page at the root by design</h1>';
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
