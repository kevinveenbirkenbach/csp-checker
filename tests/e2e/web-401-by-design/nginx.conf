server {
  listen 80;
  server_name _;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline';" always;

  location = / {
    default_type text/html;
    return 401 '<!doctype html><title>login required</title><h1>Sign in to continue</h1>';
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
