services:
  web-ok:
    image: nginx:alpine
    container_name: csp-e2e-web-ok
    ports: []
    volumes:
      - ./web-ok/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-ok/index.html:/usr/share/nginx/html/index.html:ro

  web-404-by-design:
    image: nginx:alpine
    container_name: csp-e2e-web-404-by-design
    ports: []
    volumes:
      - ./web-404-by-design/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-404-by-design/index.html:/usr/share/nginx/html/index.html:ro

  web-bad:
    image: nginx:alpine
    container_name: csp-e2e-web-bad
    ports: []
    volumes:
      - ./web-bad/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-bad/index.html:/usr/share/nginx/html/index.html:ro

  web-http-only:
    image: nginx:alpine
    container_name: csp-e2e-web-http-only
    ports: []
    volumes:
      - ./web-http-only/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-http-only/index.html:/usr/share/nginx/html/index.html:ro

  web-tls-selfsigned:
    image: nginx:alpine
    container_name: csp-e2e-web-tls-selfsigned
    ports: []
    volumes:
      - ./web-tls-selfsigned/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-tls-selfsigned/index.html:/usr/share/nginx/html/index.html:ro
      - ./web-tls-selfsigned/certs:/etc/nginx/certs:ro

  web-redirecting:
    image: nginx:alpine
    container_name: csp-e2e-web-redirecting
    ports: []
    volumes:
      - ./web-redirecting/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-redirecting/index.html:/usr/share/nginx/html/index.html:ro
      - ./web-redirecting/landed.html:/usr/share/nginx/html/landed.html:ro

  web-slow:
    image: python:3-alpine
    container_name: csp-e2e-web-slow
    ports: []
    command: ["python3", "/srv/server.py"]
    volumes:
      - ./web-slow/server.py:/srv/server.py:ro

  # Reachable ONLY via the SOCKS proxy: lives on an isolated network, so a
  # direct probe from the default network must fail while --proxy succeeds.
  web-proxied:
    image: nginx:alpine
    container_name: csp-e2e-web-proxied
    ports: []
    networks:
      - proxied
    volumes:
      - ./web-proxied/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-proxied/index.html:/usr/share/nginx/html/index.html:ro

  socks-proxy:
    image: serjs/go-socks5-proxy:latest
    container_name: csp-e2e-socks-proxy
    ports: []
    environment:
      REQUIRE_AUTH: "false"
    networks:
      - default
      - proxied

networks:
  proxied: {}
