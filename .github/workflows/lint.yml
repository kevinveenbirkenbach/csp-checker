name: Lint

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shellcheck all shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' | xargs --no-run-if-empty shellcheck

  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax-check all JS entrypoints
        run: |
          git ls-files '*.js' | xargs --no-run-if-empty -n1 node --check

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # Version pins come from the base image / apk index on purpose.
          ignore: DL3018
